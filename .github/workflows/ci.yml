name: Portable Jaal Viewer CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/*.test.cjs
      - run: python -m jaal_topology --help
      - name: Standalone Dash smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          from jaal_topology import load_graph, select_subgraph
          from jaal_topology.viewer import build_app
          e = Path("examples/relationships.csv")
          m = Path("examples/metadata.csv")
          a = build_app(select_subgraph(load_graph(e, m), "Root"), root="Root")
          assert a.server.test_client().get("/_dash-layout").status_code == 200
          for name in ("16.jaal_visible_labels.js", "17.jaal_structural_collapse.js", "18.jaal_community_collapse.js", "bootstrap.min.css"):
              assert a.server.test_client().get("/assets/" + name).status_code == 200
          company = build_app(select_subgraph(load_graph(
              Path("examples/company_communications.csv"),
              Path("examples/company_people.csv")
          )))
          assert company.server.test_client().get("/_dash-layout").status_code == 200
          PY

  browser-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install portable Jaal and Chromium automation
        run: python -m pip install -e . playwright
      - name: Install pinned Playwright Chromium browser
        run: python -m playwright install chromium
      - name: Validate real Windows browser / same-port iframe
        run: python tests/browser_acceptance.py --evidence browser-evidence
      - name: Align standalone runtime with Vercel dependency versions
        run: python -m pip install -r requirements.txt
      - name: Validate deployed Flask entry through real Windows Chromium
        run: python tests/vercel_runtime_browser.py
      - name: Build read-only static Vercel PoC without deploying
        run: node vercel-poc/build.mjs
      - name: Exercise real PoC graph interactions in Windows Chromium
        run: python tests/vercel_poc_browser.py
      - name: Retain actual browser screenshots and server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jaal-windows-browser-evidence
          path: browser-evidence/
          if-no-files-found: warn

  clean-wheel:
    name: clean-wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build non-editable wheel
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
      - name: Smoke isolated wheel away from checkout
        shell: bash
        run: |
          python -m venv .wheel-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON="$PWD/.wheel-venv/Scripts/python.exe"
          else
            PYTHON="$PWD/.wheel-venv/bin/python"
          fi
          "$PYTHON" -m pip install --no-cache-dir wheelhouse/*.whl
          cd "$HOME"
          "$PYTHON" - <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path
          from flask import Flask
          import jaal_topology
          from jaal_topology import ASSETS_DIR, load_graph
          from jaal_topology.community import detect_louvain
          from jaal_topology.email_simulation import EmailEvent
          from jaal_topology.integration import mount_flask
          from jaal_topology.temporal import TemporalTimeline
          from jaal_topology.viewer import build_app
          
          # Run outside the checkout; importing the editable source would be a false PASS.
          source = Path(jaal_topology.__file__).resolve()
          assert source.is_relative_to(Path(sys.prefix).resolve()), (source, sys.prefix)
          assert ASSETS_DIR.is_dir()
          with tempfile.TemporaryDirectory() as scratch:
              edges = Path(scratch) / "edges.csv"
              edges.write_text("source,target\nRoot,Child\nChild,Root\n", encoding="utf-8")
              graph = load_graph(edges)
              assert set(graph.nodes) == {"Root", "Child"}
              assert set(detect_louvain(graph).member_to_group) == set(graph.nodes)
              standalone = build_app(graph)
              assert standalone.server.test_client().get("/_dash-layout").status_code == 200
              # External consumer opt-in, from a non-editable wheel on both OSes.
              # No cloned project modules or Git checkout on the Python import path.
              events = (
                  EmailEvent("m1", "2026-10-05T09:00", "thread-a",
                             "Root", "Child", "team-routine", "hello"),
                  EmailEvent("m2", "2026-10-06T10:00", "thread-a",
                             "Child", "Root", "team-routine", "reply",
                             reply_to="m1"),
              )
              timeline = TemporalTimeline(graph, events)
              day, meta = timeline.snapshot(1, mode="rolling", window_days=1)
              assert day.edge_counts == {("Child", "Root"): 1}
              assert meta["messages"] == 1
              packet = timeline.frames(mode="rolling", window_days=1)
              assert len(packet["frames"]) == 2
              assert packet["frames"][0]["messages"] == 1
              assert packet["frames"][1]["edges"] == [["Child", "Root", 1]]
              assert graph.edge_counts is None  # unchanged CSV source
              host = Flask("clean_wheel_smoke")
              @host.get("/upstream-health")
              def upstream_health():
                  return "consumer-host-ok"
              mounted = mount_flask(host, graph, mount_path="/installed-graph",
                                    temporal_timeline=timeline)
              client = host.test_client()
              assert client.get("/upstream-health").get_data(as_text=True) == "consumer-host-ok"
              layout_response = client.get("/installed-graph/_dash-layout")
              assert layout_response.status_code == 200
              serialized = json.dumps(layout_response.get_json(), ensure_ascii=False)
              assert "jaal-temporal-controls" in serialized
              assert "jaal-temporal-frames" in serialized
              assert "jaal-temporal-window" in serialized
              assert "jaal-temporal-frame" in serialized
              callback_response = client.get("/installed-graph/_dash-dependencies")
              assert callback_response.status_code == 200
              assert "jaal-temporal" in callback_response.get_data(as_text=True)
              assert mounted.callback_map
              print("CLEAN_WHEEL_TEMPORAL_CONSUMER_PASS", sys.platform,
                    meta["messages"], len(packet["frames"]))
              for asset in (
                  "16.jaal_visible_labels.js", "17.jaal_structural_collapse.js",
                  "18.jaal_community_collapse.js", "bootstrap.min.css",
              "19.jaal_compact_layout.css", "20.jaal_focus_escape.js", "21.jaal_temporal_playback.js",
              ):
                  assert client.get("/installed-graph/assets/" + asset).status_code == 200, asset
          print("CLEAN_WHEEL_ISOLATED_HTTP_PASS", sys.platform, source)
          PY

  dash-major-compat:
    name: dash-major (${{ matrix.dash_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dash_version: ["2.18.2", "3.4.0", "4.5.0"]
    env:
      SELECTED_DASH: ${{ matrix.dash_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install current Jaal with selected stable Dash release
        run: python -m pip install -e . "dash==${{ matrix.dash_version }}"
      - name: Reject dependency conflicts and verify Dash version
        run: |
          python -m pip check
          python - <<'PY'
          import os
          from importlib.metadata import version
          assert version('dash') == os.environ['SELECTED_DASH']
          assert version('jaal-topology-viewer')
          print('DASH_VERSION_SELECTED', version('dash'))
          PY
      - name: Test Python graph and same-port Dash contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  vercel-flask:
    name: vercel-flask (python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Vercel Flask and Dash sample dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify installed runtime contract
        run: |
          python -m pip check
          python -m unittest discover -s tests -p 'test_vercel_runtime.py' -v

